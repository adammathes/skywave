<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Skywave: a chill, single-player driving game in your browser.">
<title>Skywave</title>

<!--
  Built into dist/ by tools/web-build.sh, which fills in the version and the wasm size.
  Query keys: see crates/platform-web/src/lib.rs (gl=1 forces WebGL2, gpu=1 WebGPU with no
  fallback, diag=1 shows the start-up diagnostics instead of the game). The controls are
  the game's own card (app::ui::controls), drawn in the canvas.
  Hooks for tools/screenshot: window.skywaveReady (overlays are gone by then),
  window.skywaveBackend, window.skywaveError; also window.skywaveNotes (fallback and
  warning lines), window.skywaveDiag (the diag=1 report), window.skywavePanic.
  Sound: window.skywaveAudio (see the sfx script). Radio: window.skywaveRadio (see the radio
  script; registered once per page, the WebGL2 restart's app finds the same player). The
  player's own music: window.skywaveMusic (the music script).
-->
<style>
  :root {
    --text: #eeeade; --dim: #969eb0; --accent: #ffb23e; --panel: rgba(12, 16, 28, 0.94);
    --rule: #3c445c; --bg: #0b0d10; --bad: #eb5046;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { color: var(--text); font: 14px/1.5 var(--mono); }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px;
    box-sizing: border-box; text-align: center;
  }
  [hidden] { display: none !important; }
  #loading { background: var(--bg); }
  #logo { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.35em; padding-left: 0.35em; }
  #bar { width: min(320px, 70vw); height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
  #status { color: var(--dim); font-size: 12px; letter-spacing: 0.08em; min-height: 1.5em; }
  #error {
    max-width: 34em; padding: 12px 16px; border-left: 3px solid var(--bad);
    background: rgba(90, 31, 31, 0.5); color: #f3d9d9; text-align: left;
  }
  .card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
    padding: 20px 26px; max-width: 640px; max-height: 90vh; overflow: auto;
  }
  .card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.25em; color: var(--accent); }
  #diag { background: var(--bg); }
  #diag .card { max-width: min(960px, 100%); box-sizing: border-box; text-align: left; }
  #diag pre {
    margin: 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
    user-select: text;
  }
  #diag button {
    font: inherit; color: var(--text); background: var(--rule); border: 0; border-radius: 3px;
    padding: 2px 10px; margin-left: 8px; cursor: pointer;
  }
  table { border-collapse: collapse; font-size: 13px; text-align: left; }
  th { color: var(--dim); font-weight: normal; font-size: 11px; letter-spacing: 0.15em; padding: 0 14px 6px 0; }
  td { padding: 3px 14px 3px 0; border-top: 1px solid rgba(60, 68, 92, 0.5); white-space: nowrap; }
  td:first-child { color: var(--dim); }
  kbd { font: inherit; color: var(--text); padding: 0 4px; border: 1px solid var(--rule); border-radius: 3px; }
  .card p { margin: 14px 0 0; color: var(--dim); font-size: 12px; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; font-size: 11px;
    color: var(--dim); text-align: center; letter-spacing: 0.05em;
  }
  footer a { color: var(--dim); }
  #note { white-space: pre-line; color: var(--accent); margin-top: 2px; }
  /* Hidden over the game, except for a while after a fallback or warning note. */
  body.playing footer:not(.noted) { display: none; }
</style>
</head>
<body>
<canvas id="skywave" tabindex="0"></canvas>
<div id="loading" class="overlay">
  <img id="logo" alt="">
  <h1>SKYWAVE</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="status" aria-live="polite">Loading</div>
  <div id="error" role="alert" hidden></div>
</div>
<div id="diag" class="overlay" hidden>
  <div class="card">
    <h2>START-UP DIAGNOSTICS</h2>
    <pre id="diag-text"></pre>
    <p>Paste this into a bug report.<button id="diag-copy" type="button">Copy</button></p>
  </div>
</div>
<footer>Skywave · created by Adam Mathes · <span id="version">%SKYWAVE_VERSION%</span><span id="backend"></span> · <a href="https://github.com/adammathes/skywave" target="_blank" rel="noopener">source</a> · BSD-3-Clause<div id="note" hidden></div></footer>
<script id="sfx">
  // Sound effects sink (crates/platform-web/src/sfx.rs). The game renders 48 kHz stereo on
  // the main thread every animation frame and pushes it here; an AudioWorklet, registered
  // from a Blob URL so it needs no extra file, plays it from a ring buffer (resampling if
  // the browser would not run the context at 48 kHz). The context starts on the first key,
  // click or tap (browsers allow sound only after a gesture) and later gestures resume it.
  // window.skywaveSfx.start() starts it from any other gesture handler. window.skywaveAudio
  // reports { state, worklet, sampleRate, pushed, consumed, underruns, queued, error }.
  (() => {
    const RATE = 48000, BLOCK = 256, RING = 16384; // frames; the ring holds ~340 ms
    const processor = `
      class SkywaveSfx extends AudioWorkletProcessor {
        constructor(options) {
          super();
          this.ring = new Float32Array(${RING} * 2);
          this.write = 0; this.read = 0; this.queued = 0; this.frac = 0;
          this.step = options.processorOptions.step; // 48 kHz frames per output frame
          this.consumed = 0; this.underruns = 0; this.fed = false; this.reported = 0;
          this.port.onmessage = (e) => this.take(e.data);
        }
        take(x) {
          const n = x.length >> 1;
          for (let i = 0; i < n; i++) {
            this.ring[2 * this.write] = x[2 * i];
            this.ring[2 * this.write + 1] = x[2 * i + 1];
            this.write = (this.write + 1) % ${RING};
          }
          this.queued += n;
          if (this.queued > ${RING}) { // overrun: drop the oldest
            this.read = (this.read + this.queued - ${RING}) % ${RING};
            this.queued = ${RING};
          }
          this.fed = true;
        }
        process(inputs, outputs) {
          const l = outputs[0][0], r = outputs[0][1] || l, ring = this.ring;
          let starved = false;
          for (let i = 0; i < l.length; i++) {
            if (this.queued < 2) { l[i] = 0; r[i] = 0; starved = true; continue; }
            const a = this.read, b = (a + 1) % ${RING}, f = this.frac;
            l[i] = ring[2 * a] + (ring[2 * b] - ring[2 * a]) * f;
            r[i] = ring[2 * a + 1] + (ring[2 * b + 1] - ring[2 * a + 1]) * f;
            this.frac += this.step;
            const whole = Math.floor(this.frac);
            this.frac -= whole;
            this.read = (this.read + whole) % ${RING};
            this.queued -= whole;
            this.consumed += whole;
          }
          if (starved && this.fed) this.underruns++;
          if (currentTime - this.reported >= 0.1) {
            this.reported = currentTime;
            this.port.postMessage({ consumed: this.consumed, underruns: this.underruns, queued: this.queued });
          }
          return true;
        }
      }
      registerProcessor("skywave-sfx", SkywaveSfx);`;
    const audio = (window.skywaveAudio = {
      state: "off", worklet: false, sampleRate: 0, pushed: 0, consumed: 0, underruns: 0, queued: 0, error: null,
    });
    let ctx = null, node = null, starting = null, written = 0;
    function start() {
      if (ctx) {
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        return starting;
      }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx || !window.AudioWorkletNode) { audio.state = "unsupported"; return null; }
      try { ctx = new Ctx({ sampleRate: RATE, latencyHint: "interactive" }); }
      catch { ctx = new Ctx({ latencyHint: "interactive" }); }
      audio.sampleRate = ctx.sampleRate;
      audio.state = ctx.state;
      ctx.onstatechange = () => { audio.state = ctx.state; };
      const url = URL.createObjectURL(new Blob([processor], { type: "text/javascript" }));
      starting = ctx.audioWorklet.addModule(url).then(() => {
        node = new AudioWorkletNode(ctx, "skywave-sfx", {
          numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
          processorOptions: { step: RATE / ctx.sampleRate },
        });
        node.port.onmessage = (e) => Object.assign(audio, e.data);
        node.connect(ctx.destination);
        written = ctx.currentTime * RATE;
        audio.worklet = true;
      }).catch((e) => { audio.error = String(e); }).finally(() => URL.revokeObjectURL(url));
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      return starting;
    }
    // 48 kHz frames the game should render now: enough for two blocks plus one animation
    // frame (dt seconds, capped) queued ahead of what the context has played.
    function wanted(dt) {
      if (!node || ctx.state !== "running") return 0;
      const played = ctx.currentTime * RATE;
      if (written < played) written = played; // ran dry, or just started
      const lead = Math.min(RING / 2, 2 * BLOCK + Math.ceil(Math.min(dt, 0.1) * RATE));
      const need = lead - (written - played);
      return need > 0 ? Math.ceil(need / BLOCK) * BLOCK : 0;
    }
    // A view into wasm memory: copied at once, then handed to the worklet.
    function push(view) {
      if (!node) return;
      const copy = view.slice();
      const frames = copy.length / 2;
      node.port.postMessage(copy, [copy.buffer]); // detaches `copy`
      written += frames;
      audio.pushed += frames;
    }
    window.skywaveSfx = { start, wanted, push };
    for (const t of ["keydown", "pointerdown", "pointerup", "touchend"]) {
      window.addEventListener(t, start, { capture: true, passive: true });
    }
  })();
</script>
<script id="radio">
  // Car radio player, separate from the sfx sink. The game (crates/audio, platform-web)
  // sends its RadioCommands to window.skywaveRadio.command(kind, url, token, value, name)
  // and polls takeEvent() for what happened ("started|failed|blocked <token>"); report(text)
  // gets the radio's state and the corner readout's text (`readout`: badge and status, then
  // artist, album and song). The deck (the player's own music) uses this player too. Nothing loads until the game asks for a stream: the only network
  // use is the stream URL the player chose. The dial sweep between stations is not played
  // here: the game synthesizes it with its other sounds (the sfx worklet above).
  // Browsers play sound only after a user gesture: a refused play() is reported as blocked
  // (the game shows "Press any key for radio") and retried on the next key, click or touch.
  // A stream that neither plays nor errors within STALL_MS is reported as failed, so the
  // game moves on instead of sitting in silence (files report their errors, and a slow
  // machine may take longer to start one). "file" plays one of the player's own music
  // files (window.skywaveMusic below) by its key from `value` seconds in, through the same
  // element: it streams the file from disk and decodes as it plays, where decodeAudioData
  // would hold a whole track as PCM (~100 MB for five minutes); its end is reported as
  // "ended".
  // Registered once per page: after a WebGL2 restart the new app instance finds this same
  // player. Debugging: skywaveRadio.log (recent commands, events, states), .state, .audio.
  (() => {
    const audio = document.createElement("audio");
    audio.preload = "none";
    audio.hidden = true;
    document.body.appendChild(audio);
    const events = [];
    const log = [];
    let token = 0; // the Play being played; 0 when stopped
    let blocked = 0; // the Play waiting for a user gesture
    let volume = 1;
    let stall = 0; // the timer that fails a Play that never started
    let blobUrl = ""; // the music file playing, as an object URL
    let startAt = 0; // where that file starts, s
    const STALL_MS = 10000;
    const note = (line) => { log.push(line); if (log.length > 200) log.shift(); };
    const emit = (type, t) => {
      if (!t || t !== token) return;
      events.push(`${type} ${t}`);
      note(`event ${type} ${t}`);
    };
    audio.addEventListener("playing", () => { clearTimeout(stall); emit("started", token); });
    audio.addEventListener("error", () => { if (audio.getAttribute("src")) emit("failed", token); });
    audio.addEventListener("ended", () => { if (blobUrl) emit("ended", token); });
    audio.addEventListener("loadedmetadata", () => {
      if (blobUrl && startAt > 0 && startAt < audio.duration - 1) audio.currentTime = startAt;
    });
    const unblob = () => { if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = ""; } };
    const arm = (t) => {
      clearTimeout(stall);
      stall = setTimeout(() => { if (blocked !== t) emit("failed", t); }, STALL_MS);
    };
    const tryPlay = (t) => {
      const p = audio.play();
      if (p && p.catch) p.catch((e) => {
        if (t !== token) return;
        if (e && e.name === "NotAllowedError") { blocked = t; emit("blocked", t); }
        else if (!(e && e.name === "AbortError")) emit("failed", t);
      });
    };
    const stop = () => {
      clearTimeout(stall);
      token = 0;
      blocked = 0;
      audio.pause();
      if (audio.getAttribute("src")) { audio.removeAttribute("src"); audio.load(); }
      unblob();
    };
    const metadata = (name) => {
      try {
        if (name && "mediaSession" in navigator && window.MediaMetadata) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: name, artist: "Skywave radio" });
        }
      } catch { /* optional */ }
    };
    const gesture = () => {
      if (blocked && blocked === token) { blocked = 0; note("retry after a gesture"); if (!blobUrl) arm(token); tryPlay(token); }
    };
    for (const t of ["keydown", "mousedown", "touchstart"]) window.addEventListener(t, gesture, true);
    window.skywaveRadio = {
      audio, log, state: "off",
      command(kind, url, t, value, name) {
        note(kind === "play" || kind === "file" ? `${kind} ${url} ${t}` : `${kind} ${value || ""}`.trim());
        if (kind === "play" || kind === "file") {
          token = t;
          blocked = 0;
          unblob();
          if (kind === "file") {
            const file = window.skywaveMusic && window.skywaveMusic.file(url);
            if (!file) { emit("failed", t); return; }
            blobUrl = URL.createObjectURL(file);
            startAt = value || 0;
            audio.src = blobUrl;
          } else audio.src = url;
          audio.volume = volume;
          metadata(name);
          // A stream can hang without an error; a file on disk reports one, and a slow
          // machine may take longer than STALL_MS to start it.
          if (kind === "play") arm(t);
          tryPlay(t);
        } else if (kind === "stop") stop();
        else if (kind === "volume") { volume = Math.min(1, Math.max(0, value)); audio.volume = volume; }
      },
      takeEvent() { return events.length ? events.shift() : null; },
      readout: "",
      report(state, readout) {
        this.state = state;
        this.readout = readout || "";
        note(`state ${state}`);
      },
    };
  })();
</script>
<script id="music">
  // The player's own music, the deck's library. Folders come from "Music library" in the
  // game's Audio settings (showDirectoryPicker where the browser has it, else a folder
  // input) or from dropping files or folders on the page. Picked or dropped folders join
  // one library, which the game indexes as Artist > Album from their layout and tags (loose
  // dropped files: one "Mixtape" album). The files stay here: the game takes each file's
  // path in its folder, size and first bytes (for tags) with take(), one at a time and a
  // few each frame, then the folder (its id and name) once all its files are taken; the
  // first bytes wait for it under a small budget (QUEUED) and are dropped once taken. It
  // plays a file through the radio player by its
  // key ("<folder id>/<path in it>"), so nothing is uploaded or sent anywhere. Picked
  // folders, and loose dropped files, are remembered as handles in IndexedDB (with a stable
  // id) where the browser can store them; when it cannot, or has not granted reading them
  // again, `again` is true and the game's menu says "Pick music folder again". While a
  // remembered folder waits for the browser's permission, `reconnect` is true (the game
  // says "Press any key to reconnect your music") and each key or click asks one folder's
  // permission (pick() does the same, or opens the picker). forget(id) drops a folder for
  // good ("*": all). The picker needs a user activation (a key or a click; a gamepad press
  // is none): pick() returns false when there is none, and the game says how else to add
  // music.
  (() => {
    const HEAD = 64 * 1024; // audio::music::HEAD_BYTES
    const WINDOW = 6 * 1024; // audio::music::PROBE_WINDOW
    const MAX_FILES = 4096; // audio::music::MAX_TRACKS
    const QUEUED = 2 * 1024 * 1024; // bytes read and not yet taken, at most (about)
    const AUDIO = /\.(mp3|m4a|aac|mp4|ogg|oga|opus|flac|wav|webm)$/i;
    const PICKED_KEY = "skywave.musicPicked";
    const tester = document.createElement("audio");
    const playable = (f) => AUDIO.test(f.name) && (!f.type || tester.canPlayType(f.type) !== "");
    const files = new Map(); // key -> File
    const ready = []; // files read, then their folder, for take()
    let queued = 0; // bytes in `ready`
    let drained = null; // wakes add() when take() has made room
    let adding = Promise.resolve(); // one folder at a time: its files reach take() together
    let roots = []; // remembered folders: { id, handle, tape, granted, asked }
    let asking = false; // a permission prompt is up
    const storage = (fn) => { try { return fn(localStorage); } catch { return null; } };
    const newId = (p) => p + Math.random().toString(16).slice(2, 10);
    // A folder without a handle (the folder input, a dropped folder or loose files) is the
    // same folder when its name and files (paths and sizes) are: picked again, it replaces
    // itself rather than doubling every album.
    const sameId = (p, name, list) => {
      let h = 0x811c9dc5;
      const text = name + "\n" + list.map((e) => `${e.rel}:${e.file.size}`).sort().join("\n");
      for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 0x01000193) >>> 0;
      return p + h.toString(16).padStart(8, "0");
    };

    // Where the audio starts after an ID3v2 tag (audio::music::audio_start).
    const audioStart = (h) => (h.length >= 10 && h[0] === 0x49 && h[1] === 0x44 && h[2] === 0x33
      ? 10 + ((h[6] & 0x7f) << 21 | (h[7] & 0x7f) << 14 | (h[8] & 0x7f) << 7 | (h[9] & 0x7f)) + (h[5] & 0x10 ? 10 : 0)
      : 0);

    // The bytes of `file` audio::music::probe reads: its first HEAD at most, cut
    // WINDOW past where its audio starts, and the audio's start apart when cover art
    // pushes it beyond that.
    async function head(file) {
      const bytes = async (from, to) => new Uint8Array(await file.slice(from, to).arrayBuffer());
      const start = audioStart(await bytes(0, 10));
      const head = await bytes(0, Math.min(HEAD, start + WINDOW));
      const audio = start + 4 > head.length && start < file.size ? await bytes(start, start + 4096) : new Uint8Array(0);
      return { head, audio };
    }

    // One folder of the library: `id` called `name`, from [{rel, file}]; `mixtape`: loose
    // dropped files.
    function add(id, name, list, announce, kept, mixtape) {
      adding = adding.then(() => addNow(id, name, list, announce, kept, mixtape))
        .catch((e) => console.warn("skywave: music folder", e));
      return adding;
    }
    async function addNow(id, name, list, announce, kept, mixtape) {
      const entries = list.filter((e) => playable(e.file)).sort((a, b) => a.rel.localeCompare(b.rel)).slice(0, MAX_FILES);
      for (const k of [...files.keys()]) if (k.startsWith(`${id}/`)) files.delete(k);
      for (const { rel, file } of entries) {
        while (queued > QUEUED) await new Promise((ok) => { drained = ok; });
        let read = { head: new Uint8Array(0), audio: new Uint8Array(0) };
        try { read = await head(file); } catch { /* unreadable: the file name will do */ }
        const key = `${id}/${rel}`;
        files.set(key, file);
        queued += read.head.length + read.audio.length;
        ready.push({ key, rel, size: file.size, head: read.head, audio: read.audio });
      }
      if (entries.length > 0 || announce) ready.push({ folder: true, path: id, name, announce, kept, mixtape: !!mixtape });
      if (entries.length > 0) {
        if (kept) music.again = roots.some((r) => !r.granted);
        else storage((s) => s.setItem(PICKED_KEY, "1"));
      }
    }

    async function walkHandle(dir, path, out, depth) {
      for await (const [name, h] of dir.entries()) {
        if (out.length >= MAX_FILES * 4) return;
        const rel = path ? `${path}/${name}` : name;
        if (h.kind === "file") { if (AUDIO.test(name)) out.push({ rel, file: await h.getFile() }); }
        else if (depth < 8) await walkHandle(h, rel, out, depth + 1);
      }
    }
    async function walkEntry(entry, path, out, depth) {
      const rel = path ? `${path}/${entry.name}` : entry.name;
      if (entry.isFile) {
        if (AUDIO.test(entry.name)) out.push({ rel, file: await new Promise((ok, no) => entry.file(ok, no)) });
        return;
      }
      if (depth > 8 || out.length >= MAX_FILES * 4) return;
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
        if (batch.length === 0) break;
        for (const e of batch) await walkEntry(e, depth === 0 ? "" : rel, out, depth + 1);
      }
    }
    async function scan(root, announce) {
      const out = [];
      if (root.tape) {
        for (const h of root.tape) {
          try { out.push({ rel: h.name, file: await h.getFile() }); } catch { /* moved or deleted */ }
        }
      } else {
        try { await walkHandle(root.handle, "", out, 0); } catch (e) { console.warn("skywave: music folder", e); }
      }
      await add(root.id, root.tape ? "Mixtape" : root.handle.name, out, announce, true, !!root.tape);
    }

    // A remembered root's handles: its folder's, or a mixtape's files. It is readable when
    // any is (a mixtape's files not granted are left out of its scan).
    const handles = (r) => r.tape || [r.handle];
    async function granted(r) {
      for (const h of handles(r)) {
        try { if ((await h.queryPermission({ mode: "read" })) === "granted") return true; } catch { /* gone */ }
      }
      return false;
    }
    // Asks the next waiting root's permission: one prompt per press, as a prompt uses up
    // the key's user activation. A browser that restores every permission from one prompt
    // grants the others too: they are read as well.
    async function reconnect() {
      const r = roots.find((o) => !o.granted && !o.asked);
      if (!r) return;
      asking = true;
      r.asked = true;
      try {
        for (const h of handles(r)) if ((await h.requestPermission({ mode: "read" })) !== "granted") break;
      } catch { /* refused, or no activation left */ }
      for (const o of roots) {
        if (!o.granted && (await granted(o))) { o.granted = true; await scan(o, true); }
      }
      asking = false;
      music.reconnect = roots.some((o) => !o.granted && !o.asked);
      music.again = roots.some((o) => !o.granted);
    }
    for (const t of ["keydown", "pointerdown"]) {
      window.addEventListener(t, () => {
        if (asking || !music.reconnect) return;
        if (navigator.userActivation && !navigator.userActivation.isActive) return; // Esc gives none
        reconnect();
      }, true);
    }

    // Remembered folders (IndexedDB; handles are structured-clonable where supported).
    const db = () => new Promise((ok, no) => {
      const r = indexedDB.open("skywave", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("music");
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
    });
    async function store() {
      try {
        const d = await db();
        d.transaction("music", "readwrite").objectStore("music")
          .put(roots.map(({ id, handle, tape }) => ({ id, handle, tape })), "roots");
      } catch { /* private mode: not remembered */ }
    }
    async function load() {
      try {
        const d = await db();
        return await new Promise((ok) => {
          const r = d.transaction("music").objectStore("music").get("roots");
          r.onsuccess = () => ok(Array.isArray(r.result) ? r.result : []);
          r.onerror = () => ok([]);
        });
      } catch { return []; }
    }
    // The remembered root for `handle` (the same folder keeps its id), added if new.
    async function remember(handle) {
      for (const r of roots) if (r.handle && (await r.handle.isSameEntry(handle))) { r.granted = true; return r; }
      const r = { id: newId("h"), handle, tape: null, granted: true, asked: false };
      roots.push(r);
      await store();
      return r;
    }
    // Loose dropped files as a remembered mixtape (`id` from their names and sizes, so the
    // same drop replaces itself).
    async function rememberTape(id, tape) {
      roots = roots.filter((r) => r.id !== id);
      roots.push({ id, handle: null, tape, granted: true, asked: false });
      await store();
    }

    const input = document.createElement("input");
    input.type = "file";
    input.multiple = true;
    input.webkitdirectory = true;
    input.hidden = true;
    document.body.appendChild(input);
    input.addEventListener("change", () => {
      const list = [...input.files].map((f) => {
        const p = f.webkitRelativePath || f.name;
        return { rel: p.includes("/") ? p.slice(p.indexOf("/") + 1) : p, file: f, top: p.split("/")[0] };
      });
      input.value = "";
      const name = (list[0] && list[0].top) || "My music";
      add(sameId("p", name, list), name, list, true, false);
    });

    window.addEventListener("dragover", (e) => {
      if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      }
    });
    window.addEventListener("drop", (e) => {
      if (!e.dataTransfer) return;
      e.preventDefault();
      // DataTransfer items are only readable during the event: take entries and handles now.
      const items = [...e.dataTransfer.items].filter((i) => i.kind === "file");
      const taken = items.map((i) => ({
        entry: i.webkitGetAsEntry ? i.webkitGetAsEntry() : null,
        handle: i.getAsFileSystemHandle ? i.getAsFileSystemHandle().catch(() => null) : null,
        file: i.getAsFile(),
      }));
      (async () => {
        const loose = [];
        for (const t of taken) {
          const h = t.handle && (await t.handle);
          if (h && h.kind === "directory") await scan(await remember(h), true);
          else if (t.entry && t.entry.isDirectory) {
            const out = [];
            await walkEntry(t.entry, "", out, 0);
            await add(sameId("d", t.entry.name, out), t.entry.name, out, true, false);
          } else if (t.file) loose.push({ rel: t.file.name, file: t.file, handle: h && h.kind === "file" ? h : null });
        }
        if (loose.length > 0) {
          const id = sameId("d", "Mixtape", loose);
          const kept = !!window.showDirectoryPicker && loose.every((l) => l.handle);
          if (kept) await rememberTape(id, loose.map((l) => l.handle));
          await add(id, "Mixtape", loose, true, kept, true);
        }
      })();
    });

    async function pickNow() {
      if (roots.some((r) => !r.granted && !r.asked)) return reconnect();
      if (window.showDirectoryPicker) {
        try {
          const h = await window.showDirectoryPicker({ id: "skywave-music", mode: "read", startIn: "music" });
          await scan(await remember(h), true);
        } catch { /* cancelled */ }
      } else input.click();
    }

    const music = {
      again: false,
      reconnect: false,
      // "Music library". False when there is no user activation to open a picker from.
      pick() {
        if (asking) return true; // this press already asked for a remembered folder
        if (navigator.userActivation && !navigator.userActivation.isActive) return false;
        pickNow();
        return true;
      },
      // The next file read ({key, rel, size, head, audio}), or the folder they were all
      // in ({folder: true, path, name, announce, kept, mixtape}) after its last file.
      take() {
        const item = ready.shift();
        if (!item) return null;
        if (!item.folder) queued -= item.head.length + item.audio.length;
        if (drained && queued <= QUEUED) { drained(); drained = null; }
        return item;
      },
      get tracks() { return files.size; }, // for tests
      file(key) { return files.get(String(key)) || null; },
      forget(id) {
        if (id === "*") {
          roots = [];
          files.clear();
          storage((s) => s.removeItem(PICKED_KEY));
        } else {
          roots = roots.filter((r) => r.id !== id);
          for (const k of [...files.keys()]) if (k.startsWith(`${id}/`)) files.delete(k);
        }
        music.again = roots.some((r) => !r.granted);
        music.reconnect = roots.some((r) => !r.granted && !r.asked);
        store();
      },
    };
    window.skywaveMusic = music;

    (async () => {
      roots = window.showDirectoryPicker
        ? (await load()).map(({ id, handle, tape }) => ({ id, handle, tape: tape || null, granted: false, asked: false }))
        : [];
      for (const r of roots) {
        r.granted = await granted(r);
        if (r.granted) await scan(r, false);
      }
      music.reconnect = roots.some((r) => !r.granted);
      music.again = roots.some((r) => !r.granted) || (roots.length === 0 && !!storage((s) => s.getItem(PICKED_KEY)));
    })();
  })();
</script>
<script type="module">
  // The wasm-bindgen glue. A second, independent copy (with its own wasm instance) is
  // imported only if the first one crashes while starting on WebGPU; see `retryOnWebGL2`.
  const GLUE = "./platform_web.js";

  const $ = (id) => document.getElementById(id);
  $("logo").src = document.querySelector("link[rel=icon]").href;
  const query = new URLSearchParams(location.search);
  const diag = query.get("diag") === "1";
  const forcedGpu = query.get("gpu") === "1" && query.get("gl") !== "1";
  // Filled in by tools/web-build.sh; the server's Content-Length is the fallback (it is the
  // compressed size when the server gzips, so the bar would then finish early).
  const WASM_BYTES = Number("%SKYWAVE_WASM_BYTES%") || 0;
  const WASM_URL = new URL("./platform_web_bg.wasm", import.meta.url);

  const status = (text, fraction) => {
    $("status").textContent = text;
    if (fraction !== undefined) $("fill").style.width = `${(fraction * 100).toFixed(1)}%`;
  };
  const showError = (msg) => {
    if (window.skywaveError) return;
    window.skywaveError = msg;
    $("loading").hidden = false;
    $("bar").hidden = true;
    $("status").hidden = true;
    $("error").textContent = msg;
    $("error").hidden = false;
    document.body.classList.remove("playing");
  };

  // Start-up state: the backend the game is starting on (from `onNote("attempt")`), and
  // whether the first frame is up.
  let attempt = null;
  let ready = false;
  let retried = false;
  let crashed = null;
  const crash = new Promise((_, reject) => { crashed = reject; });
  crash.catch(() => {});

  /// Shows the footer's notes over the game for a while.
  let noteTimer = 0;
  function keepNoteUp() {
    const footer = document.querySelector("footer");
    footer.classList.add("noted");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => footer.classList.remove("noted"), 15000);
  }

  /// Notes from the game (see `Page` in crates/platform-web/src/web.rs).
  function onNote(kind, text) {
    if (kind === "attempt") {
      attempt = text;
      status(`Starting ${text}`);
    } else if (kind === "backend") {
      window.skywaveBackend = text;
      $("backend").textContent = ` · ${text}`;
    } else if (kind === "fallback" || kind === "warning") {
      // The game has logged it to the console already.
      const note = $("note");
      note.textContent = note.textContent ? `${note.textContent}\n${text}` : text;
      note.hidden = false;
      if (ready) keepNoteUp();
      window.skywaveNotes = [...(window.skywaveNotes || []), text];
    } else if (kind === "lost") {
      showError(`Skywave stopped: ${text}. Reloading the page usually brings it back.`);
    } else if (kind === "diag") {
      window.skywaveDiag = text;
      $("diag-text").textContent =
        `${text}\npage: Skywave ${$("version").textContent}, ${location.href}\n`;
    }
  }

  // A panic or trap surfaces as an uncaught error. Before the first frame on WebGPU it
  // means that start crashed: the page starts again on WebGL2 (unless gpu=1).
  window.addEventListener("error", (e) => {
    const msg = String(e.message || e.error);
    if (!ready && attempt === "WebGPU" && !forcedGpu && !retried) {
      crashed(new Error(window.skywavePanic || msg));
      return;
    }
    if (!ready && retried) {
      // Most likely the abandoned first instance; the WebGL2 start reports its own failure.
      console.warn("skywave: error during the WebGL2 restart: " + msg);
      return;
    }
    showError("Skywave stopped: " + msg);
  });

  /// Fetches and compiles the wasm, reporting download progress (0..1) to `onProgress`.
  /// Streaming compilation needs the `application/wasm` type: the counted response sets it,
  /// and a server that sends another type without a body stream falls back to compiling
  /// the downloaded bytes.
  async function compileWasm(onProgress) {
    const res = await fetch(WASM_URL);
    if (!res.ok) throw new Error(`the game file did not load (HTTP ${res.status})`);
    const total = WASM_BYTES || Number(res.headers.get("content-length")) || 0;
    let counted = res;
    if (res.body && total && typeof TransformStream !== "undefined") {
      let got = 0;
      counted = new Response(res.body.pipeThrough(new TransformStream({
        transform(chunk, out) {
          got += chunk.byteLength;
          onProgress(Math.min(1, got / total));
          out.enqueue(chunk);
        },
      })), { headers: { "content-type": "application/wasm" } });
    }
    if (typeof WebAssembly.compileStreaming === "function") {
      try {
        return await WebAssembly.compileStreaming(counted);
      } catch (e) {
        console.warn("skywave: streaming compile failed, compiling the downloaded bytes:", e);
      }
    }
    // The first response's body may be used up by now: fetch again (usually cached).
    const again = await fetch(WASM_URL);
    if (!again.ok) throw new Error(`the game file did not load (HTTP ${again.status})`);
    return WebAssembly.compile(await again.arrayBuffer());
  }

  function firstFrame(backend) {
    ready = true;
    $("loading").hidden = true;
    if (backend === "diag") {
      $("diag").hidden = false;
      window.skywaveStreamIdle = true;
    } else {
      document.body.classList.add("playing");
    }
    // A fallback note stays readable over the game for a while.
    if (!$("note").hidden) keepNoteUp();
    window.skywaveBackend = backend;
    window.skywaveReady = true;
  }

  /// Instantiates a copy of the glue on `module` and starts the game with `options`.
  async function start(glueUrl, module, options) {
    const glue = await import(glueUrl);
    await glue.default({ module_or_path: module });
    const canvas = $("skywave");
    canvas.focus();
    return glue.run(canvas, firstFrame, { onNote, ...options });
  }

  /// The first instance crashed while starting on WebGPU: its state cannot be trusted, so
  /// a fresh copy of the glue and wasm starts on WebGL2, on a fresh canvas (the old one is
  /// bound to WebGPU).
  async function retryOnWebGL2(module, reason) {
    retried = true;
    const old = $("skywave");
    const canvas = old.cloneNode(false);
    old.replaceWith(canvas);
    await start(`${GLUE}?retry=webgl2`, module, { backend: "gl", failure: String(reason) });
  }

  $("diag-copy").addEventListener("click", () => {
    const text = $("diag-text").textContent;
    const copied = () => { $("diag-copy").textContent = "Copied"; };
    try {
      navigator.clipboard.writeText(text).then(copied, () => {});
    } catch {}
  });

  // Probe on a throwaway canvas: getContext on the real one would lock it to WebGL.
  const hasWebGPU = "gpu" in navigator;
  let hasWebGL2 = false;
  try { hasWebGL2 = !!document.createElement("canvas").getContext("webgl2"); } catch {}
  if (!hasWebGPU && !hasWebGL2 && !diag) {
    showError("Skywave needs WebGPU or WebGL2, and this browser offers neither. " +
      "Try an up-to-date browser and check that hardware acceleration is turned on.");
  } else {
    let module = null;
    try {
      status("Loading", 0);
      module = await compileWasm((f) => status(`Loading ${Math.round(f * 100)}%`, f));
      status(diag ? "Running diagnostics" : "Building the town", 1);
      // Let the status paint: building the town blocks the page for a moment.
      await new Promise((ok) => requestAnimationFrame(() => setTimeout(ok, 0)));
      await Promise.race([start(GLUE, module, {}), crash]);
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      if (module && !ready && !retried && attempt === "WebGPU" && !forcedGpu) {
        console.warn("skywave: the WebGPU start crashed; restarting on WebGL2: " + msg);
        try {
          await retryOnWebGL2(module, msg);
        } catch (e2) {
          showError("Skywave failed to start: " + (e2 && e2.message ? e2.message : e2));
        }
      } else {
        showError("Skywave failed to start: " + msg);
      }
    }
  }
</script>
</body>
