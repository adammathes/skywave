[package]
name = "world"
description = "Detailing and mesh building for Skywave places: roads, buildings and props as vertex arrays."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Region template derives. serde is used without its `std` feature, so the crate stays
# no_std with this on; parsing RON happens in `app` and the tools.
default = ["serde"]
serde = ["dep:serde", "place/serde"]

[dependencies]
serde = { workspace = true, optional = true }
fastnoise-lite.workspace = true
skywave-core.workspace = true
place.workspace = true
# Collision answers the car sim's `Ground` trait and moves its `VehicleState`.
vehicle.workspace = true

[dev-dependencies]
# The collision tests load the real specs from assets/vehicles/.
ron.workspace = true
