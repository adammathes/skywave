[package]
name = "render"
description = "Skywave's wgpu renderer: sun shadow map, HDR forward pass, tonemap. Runs on WebGL2."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true

[dev-dependencies]
# Headless device for pipeline/limit validation without a GPU, and naga's GLSL ES writer
# to prove every shader translates for WebGL2. Both are already in wgpu's dependency tree.
wgpu = { workspace = true, features = ["noop"] }
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }
pollster.workspace = true
