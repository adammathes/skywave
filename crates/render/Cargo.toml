[package]
name = "render"
description = "Skywave's wgpu renderer: cascaded sun shadows, pattern atlas, analytic sky, HDR forward pass, tonemap. Runs on WebGL2."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true

[dev-dependencies]
# Headless device for pipeline/limit validation without a GPU, and naga's GLSL ES, MSL and
# SPIR-V writers to prove every shader translates for WebGL2, Metal (Safari, macOS) and
# Vulkan. All are already in wgpu's dependency tree. Vulkan (lavapipe on CI) for the tests
# that read pixels back.
wgpu = { workspace = true, features = ["noop", "vulkan"] }
naga = { workspace = true, features = ["wgsl-in", "glsl-out", "msl-out", "spv-out"] }
pollster.workspace = true
