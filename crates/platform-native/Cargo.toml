[package]
name = "platform-native"
description = "Desktop shell for Skywave: winit window, wgpu surface, keyboard, mouse and gamepad input."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "skywave"
path = "src/main.rs"

[dependencies]
app.workspace = true
render.workspace = true
wgpu = { workspace = true, features = ["vulkan", "metal", "dx12", "gles", "parking_lot"] }
winit.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
gilrs.workspace = true
cpal.workspace = true
audio.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
nanomp3-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

[dev-dependencies]
# The no-op device for the culling benchmark (`culling_on_the_coast`).
wgpu = { workspace = true, features = ["noop"] }
