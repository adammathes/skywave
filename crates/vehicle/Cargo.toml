[package]
name = "vehicle"
description = "Skywave vehicles: VehicleSpec, its validator, the raycast-car simulation and the parametric car mesh generator."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# serde is used without its `std` feature, so the crate stays no_std with this on.
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
skywave-core.workspace = true

[dev-dependencies]
# The integration tests load the real specs and shapes from assets/vehicles/.
ron.workspace = true
