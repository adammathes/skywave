name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      # Caches ~/.cargo (including installed wasm-bindgen-cli and cargo-deny) and target/.
      - uses: Swatinem/rust-cache@v2

      - name: Linux build deps (libudev for gilrs, ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Clippy (web)
        run: cargo clippy --locked --target wasm32-unknown-unknown -p platform-web --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
        env:
          SKYWAVE_ENFORCE_BUDGETS: "1"

      - name: cargo deny
        run: |
          cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
          cargo deny check

      - name: Build web
        run: tools/web-build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --global "playwright@$PLAYWRIGHT_VERSION"
          npx "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium

      # One scene keeps CI time reasonable; the full golden set is `--all` (see docs/TESTING.md).
      - name: Screenshot smoke test and wasm self-test (WebGL2 on SwiftShader)
        run: |
          export NODE_PATH="$(npm root --global)"
          node tools/screenshot/shoot.mjs --selftest --scene strip-golden-chase
          node tools/screenshot/diff.mjs --scene strip-golden-chase

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: dist/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/screenshot/out/
          if-no-files-found: warn
