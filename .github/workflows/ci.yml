name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      # Caches ~/.cargo (including installed wasm-bindgen-cli and cargo-deny) and target/.
      - uses: Swatinem/rust-cache@v2

      # lavapipe (mesa-vulkan-drivers): a software Vulkan device for the renderer's
      # fragment-count test (`fragments_on_the_coast_at_deck`).
      - name: Linux build deps (libudev for gilrs, ALSA for cpal, lavapipe)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config mesa-vulkan-drivers

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --global "playwright@$PLAYWRIGHT_VERSION"
          npx "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium

      # The checks themselves live in one script so sessions run exactly what CI runs:
      # fmt, clippy (native and web), tests with budgets enforced, cargo deny, the web build,
      # and the WebGL2/SwiftShader screenshot smoke test with the wasm self-test.
      - name: Checks (tools/ci.sh)
        run: tools/ci.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: dist/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/screenshot/out/
          if-no-files-found: warn
