[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/place",
    "crates/vehicle",
    "crates/world",
    "crates/traffic",
    "crates/render",
    "crates/audio",
    "crates/app",
    "crates/platform-native",
    "crates/platform-web",
    "tools/shape-preview",
    "tools/mapdump",
    "tools/audio-preview",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false
rust-version = "1.87"

[workspace.dependencies]
# Internal crates.
skywave-core = { path = "crates/core" }
place = { path = "crates/place" }
vehicle = { path = "crates/vehicle" }
world = { path = "crates/world" }
traffic = { path = "crates/traffic" }
render = { path = "crates/render" }
app = { path = "crates/app" }
audio = { path = "crates/audio" }

# Engine-level dependencies (the only ones allowed; see CLAUDE.md).
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
naga = { version = "=30.0.0", default-features = false }
glam = { version = "=0.34.1", default-features = false, features = ["std"] }

# Small support crates.
bytemuck = { version = "=1.25.2", features = ["derive"] }
log = "=0.4.34"
env_logger = { version = "=0.11.11", default-features = false }
pollster = "=1.0.1"
# Settings JSON (app only; see docs/adr/0002-serde-json.md).
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "=1.0.151"

# Data files. serde without `std` keeps `vehicle` no_std; ron parses the specs in `app`.
ron = { version = "=0.12.2", default-features = false }

# Terrain noise for world generation (MIT, ~3k lines, no_std through `libm`; num-traits and
# libm are already in the tree). It only uses add/mul, sqrt, trunc and abs, which are
# correctly rounded or exact, so its output is bit-identical everywhere.
fastnoise-lite = { version = "=1.1.1", default-features = false, features = ["libm"] }

# Native gamepads (platform-native only). Default features: evdev + udev on Linux (the
# Steam Deck's controller is a standard evdev pad), IOKit on macOS, Windows.Gaming.Input.
gilrs = "=0.11.2"

# Native audio output (platform-native only; Apache-2.0). ALSA on Linux (libasound2-dev to
# build), CoreAudio on macOS, WASAPI on Windows.
cpal = { version = "=0.18.2", default-features = false }

# Native radio streams (platform-native only; docs/adr/0006-native-streams.md). TLS with the
# ring provider and the system's trust store; an MP3 frame decoder (MIT/Apache, no deps).
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "=0.8.5"
nanomp3-core = { version = "=0.2.0", default-features = false }

# Web.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
console_error_panic_hook = "=0.1.7"
console_log = "=1.1.0"

# Tests are mostly long seeded simulations; unoptimized they took 21 of CI's 26 minutes.
# Optimize every crate a little and dependencies fully. Debug assertions, overflow checks
# and debug info stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# wasm32-unknown-unknown always aborts on panic; we make native release builds match so
# the shipped game behaves the same everywhere. Tests ignore this setting.
panic = "abort"
